<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Katalog Tanaman Hias</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body class="bg-[#F4F7F4] text-emerald-950 font-sans">
    <header>
        <nav class="flex flex-col gap-2 md:flex-row md:justify-between md:items-center px-6 py-4 bg-emerald-800 text-white">
            <a href="#" class="text-xl font-bold">🌱 PlantHouse</a>
            <div class="flex gap-4">
                <a href="#menu" class="hover:underline">Koleksi</a>
                <a href="#kontak" class="hover:underline">Kontak</a>
            </div>
        </nav>
    </header>

    <main class="max-w-5xl mx-auto px-6 py-10">
        <section id="menu">
            <h1 class="text-3xl font-bold mb-2">Katalog Tanaman Hias</h1>
            <p class="text-emerald-700 mb-6">Lengkapi keindahan sudut rumah dan halamanmu dengan koleksi tanaman pilihan.</p>
            
            <!-- Tombol Filter -->
            <div class="flex gap-2 mb-6">
                <button id="tombol-semua" class="px-4 py-2 rounded-lg bg-emerald-800 text-white font-medium">Semua</button>
                <button id="tombol-indoor" class="px-4 py-2 rounded-lg bg-white border border-gray-300 font-medium">Indoor</button>
                <button id="tombol-outdoor" class="px-4 py-2 rounded-lg bg-white border border-gray-300 font-medium">Outdoor</button>
            </div>

            <!-- Wadah kosong untuk kartu yang dirender oleh JavaScript -->
            <div id="daftar-kartu" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4"></div>
        </section>
    </main>

    <footer id="kontak" class="mt-10 px-6 py-6 text-center text-sm text-gray-500 border-t border-gray-200">
        <p>&copy; 2026 PlantHouse. Hak Cipta Dilindungi.</p>
    </footer>

    <!-- Script JavaScript: data.js harus di atas tampilan.js -->
    <script src="data.js"></script>
    <script src="tampilan.js"></script>
</body>
</html>
